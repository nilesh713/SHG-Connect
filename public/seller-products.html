<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Products – SHG Connect</title>
  <meta name="description" content="SHG Connect – a marketplace for Self Help Groups, artisans and small-scale producers.">
  <meta name="theme-color" content="#1f3d2b">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/vendor/lucide.min.js" defer></script>
  <script src="/js/translations.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/products.js" defer></script>
  <script src="/js/orders.js" defer></script>
  <script src="/js/notifications.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/pages/seller-products.js" defer></script>
</head>
<body data-layout="dashboard" data-require="seller" data-title="nav.myProducts">
<div class="server-warning" role="alert" style="padding:16px;margin:12px;border:2px solid #b3261e;background:#fbe7e5;font-family:sans-serif;font-size:18px">
  <strong>SHG Connect must be opened through its Node.js server.</strong><br>
  Do not open the HTML files directly or with Live Server. In the <code>shg-connect</code> folder run <code>npm start</code>, then open <a href="http://localhost:5000">http://localhost:5000</a>.
</div>
<main id="main">
<div class="row-between">
  <p class="page-intro" data-i18n="sp.intro">All your products. Drafts and products waiting for approval are only visible to you.</p>
  <a class="btn btn-primary" href="/add-product.html"><i data-lucide="plus" aria-hidden="true"></i><span data-i18n="nav.addProduct">Add Product</span></a>
</div>
<div class="tabs" role="tablist" id="sp-tabs">
  <button class="tab" role="tab" type="button" data-status="" aria-selected="true"><span data-i18n="market.all">All</span></button>
  <button class="tab" role="tab" type="button" data-status="approved" aria-selected="false"><span data-i18n="sp.live">Live</span></button>
  <button class="tab" role="tab" type="button" data-status="draft" aria-selected="false"><span data-i18n="status.draft">Draft</span></button>
  <button class="tab" role="tab" type="button" data-status="pending" aria-selected="false"><span data-i18n="status.pending">Pending</span></button>
  <button class="tab" role="tab" type="button" data-status="rejected" aria-selected="false"><span data-i18n="status.rejected">Rejected</span></button>
</div>
<div class="toolbar"><div class="input-icon"><i data-lucide="search" aria-hidden="true"></i><input class="input" id="sp-search" type="search" data-i18n-placeholder="sp.search" placeholder="Search my products" aria-label="Search my products" data-i18n-aria-label="sp.search"></div></div>
<div class="seller-products" id="sp-grid"></div>
<nav class="pagination" id="pagination"></nav>
</main>
</body>
</html>
