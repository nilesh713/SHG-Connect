<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders – SHG Connect</title>
  <meta name="description" content="SHG Connect – a marketplace for Self Help Groups, artisans and small-scale producers.">
  <meta name="theme-color" content="#1f3d2b">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/vendor/lucide.min.js" defer></script>
  <script src="/js/translations.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/products.js" defer></script>
  <script src="/js/orders.js" defer></script>
  <script src="/js/notifications.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/pages/my-orders.js" defer></script>
</head>
<body data-layout="public" data-require="any">
<div class="server-warning" role="alert" style="padding:16px;margin:12px;border:2px solid #b3261e;background:#fbe7e5;font-family:sans-serif;font-size:18px">
  <strong>SHG Connect must be opened through its Node.js server.</strong><br>
  Do not open the HTML files directly or with Live Server. In the <code>shg-connect</code> folder run <code>npm start</code>, then open <a href="http://localhost:5000">http://localhost:5000</a>.
</div>
<main id="main">
<div class="container" style="max-width:860px">
  
  <div class="page-head">
    <h1 data-i18n="nav.myOrders">My Orders</h1>
    <p data-i18n="orders.subtitle">Track your orders and give reviews after delivery.</p>
  </div>
  <div class="alert alert-success" id="placed-alert" hidden style="margin-top:12px"><i data-lucide="party-popper" aria-hidden="true"></i><p id="placed-text"></p></div>
  <div class="tabs" role="tablist" id="order-tabs" style="margin:14px 0">
    <button class="tab" role="tab" type="button" data-status="" aria-selected="true"><span data-i18n="market.all">All</span></button>
    <button class="tab" role="tab" type="button" data-status="active" aria-selected="false"><span data-i18n="orders.active">Active</span></button>
    <button class="tab" role="tab" type="button" data-status="delivered" aria-selected="false"><span data-i18n="status.delivered">Delivered</span></button>
    <button class="tab" role="tab" type="button" data-status="cancelled" aria-selected="false"><span data-i18n="status.cancelled">Cancelled</span></button>
  </div>
  <div id="orders-list" aria-live="polite"></div>
  <nav class="pagination" id="pagination"></nav>
</div>
</main>
</body>
</html>
